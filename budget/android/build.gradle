buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects { p ->
    p.buildDir = "${rootProject.buildDir}/${p.name}"
    p.plugins.withId('com.android.library') {
        if (p.android.namespace == null) {
            p.android.namespace = "com.budget.tracker_app.${p.name.replace('-', '_')}"
        }
        p.android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
    p.plugins.withId('com.android.application') {
        if (p.android.namespace == null) {
            p.android.namespace = "com.budget.tracker_app.${p.name.replace('-', '_')}"
        }
        p.android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
    p.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
